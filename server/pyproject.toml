[project]
name = "langboard-server"
version = "0.1.0"
description = "Langboard token-usage dashboard — stage 1 core (schema, /ingest, backfill)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "zstandard>=0.22",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["langboard_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
